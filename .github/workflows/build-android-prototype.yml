name: Build RestoreAI Android prototype
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tests/**'
      - 'scripts/check_android_offline_assets.py'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android-prototype.yml'
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tests/**'
      - 'scripts/check_android_offline_assets.py'
      - 'android/**'
      - 'pubspec.yaml'
      - 'assets/icon/**'
      - '.github/workflows/build-android-prototype.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Flutter Android scaffold
        run: |
          flutter create --platforms=android --project-name restoreai --org com.restoreai .
          flutter pub get
      - name: Set Android display name and launcher icon
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="restoreai"', 'android:label="RestoreAI"')
          manifest.write_text(text)
          PYTHON
          dart run flutter_launcher_icons
      - name: Verify release variant does not request Internet permission
        run: |
          if grep -R 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'Offline app must not request Internet permission'
            exit 1
          fi
      - name: Verify Android offline channel is packaged
        run: |
          test -f android/app/src/main/kotlin/com/restoreai/restoreai/MainActivity.kt
          grep -q 'enhanceBasic' android/app/src/main/kotlin/com/restoreai/restoreai/MainActivity.kt
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Test offline model asset integrity checks
        run: python3 -m unittest discover -s tests -p 'test_offline_assets.py'
      - name: Test offline engine contract
        run: flutter test test/offline_restore_pipeline_test.dart test/android_restore_engine_test.dart
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: RestoreAI-Offline-Basic-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
