name: Test RestoreAI API contract
on:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/test-cuda-api-contract.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/test-cuda-api-contract.yml'
  workflow_dispatch:

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2,<3" "numpy>=1.26,<3" -r server/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q server tests
      - name: Run HTTP contract tests (mocked inference)
        run: python -m unittest discover -s tests -p test_api.py -v
